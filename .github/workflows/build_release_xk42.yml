name: "xk42: Build & release"

on:
  workflow_dispatch:
  push:
    branches: [main, v0.3, dev, dev-v0.3]
    tags: ["build"]
    paths:
      - "boards/shields/xk42/**"
      - "build_xk42.yaml"
      - "config/behaviors.dtsi"
      - "config/combos_split42.dtsi"
      - "config/key-labels/split42.h"
      - "config/xk42.*"
      - "zephyr/**"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build_keyboard.yml
    with:
      matrix: build_xk42.yaml
      archive: xk42-firmware
      draw_keymap: false
  release:
    needs: build
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/tags/build')
    uses: ./.github/workflows/_release_keyboard.yml
    with:
      firmware_archive: xk42-firmware
      release_tag: latest-xk42
      release_name: xk42 Latest Firmware
      release_description: xk42 Build
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
