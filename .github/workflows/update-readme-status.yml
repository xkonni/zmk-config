name: Update README release dates

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update README release workflow dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          import re
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          keyboards = [
              ("Piantor Pro BT", "piantor"),
              ("Totemist", "totemist"),
              ("xk42", "xk42"),
              ("Corne Choc Pro BT", "corne"),
          ]

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def fmt(date):
              if not date:
                  return "—"
              return datetime.fromisoformat(date.replace("Z", "+00:00")).strftime("%Y-%m-%d")

          def latest_successful_run(workflow, branch):
              runs = api(
                  f"actions/workflows/{workflow}/runs?branch={branch}&status=success&per_page=100"
              )["workflow_runs"]
              for run in runs:
                  if run.get("head_branch") == branch:
                      return run
              return None

          readme = Path("README.md")
          text = readme.read_text()
          updated = text
          for name, slug in keyboards:
              workflow = f"build_release_{slug}.yml"
              runs = [
                  latest_successful_run(workflow, branch)
                  for branch in ("main", "build")
              ]
              runs = [run for run in runs if run]
              latest = max(runs, key=lambda run: run["created_at"]) if runs else None
              date = fmt(latest["created_at"]) if latest else "—"
              marker = f"<!-- RELEASE-DATE:{slug} -->"
              end_marker = f"<!-- /RELEASE-DATE:{slug} -->"
              pattern = rf"{re.escape(marker)}.*?{re.escape(end_marker)}"
              replacement = f"{marker}{date}{end_marker}"
              updated, count = re.subn(pattern, replacement, updated, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"README date markers missing for {name}")
          if updated != text:
              readme.write_text(updated)
              print("README release dates updated")
          else:
              print("README release dates are current")
          PY
      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README status changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "docs: update build and release dates"
          git push
