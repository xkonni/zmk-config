name: "Totemist: Build & release"

on:
  workflow_dispatch:
  push:
    branches: [main, v0.3, dev, dev-v0.3]
    tags: ["build"]
    paths:
      - "build_totemist.yaml"
      - "config/behaviors.dtsi"
      - "config/combos_totem.dtsi"
      - "config/key-labels/totem.h"
      - "config/totem.*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build_keyboard.yml
    with:
      matrix: build_totemist.yaml
      archive: totemist-firmware
      keymap: totem.keymap
      keymap_artifact: totemist-keymap
  release:
    needs: build
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/tags/build')
    uses: ./.github/workflows/_release_keyboard.yml
    with:
      firmware_archive: totemist-firmware
      keymap_artifact: totemist-keymap
      release_tag: latest-totemist
      release_name: Totemist Latest Firmware
      release_description: Totemist Build
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
