name: "Piantor: Build & release"

on:
  workflow_dispatch:
  push:
    branches: [main, v0.3, dev, dev-v0.3]
    tags: ["build"]
    paths:
      - "boards/arm/piantor_pro_bt/**"
      - "build_piantor.yaml"
      - "config/behaviors.dtsi"
      - "config/combos_split42.dtsi"
      - "config/key-labels/split42.h"
      - "config/piantor_pro_bt.*"
      - "zephyr/**"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build_keyboard.yml
    with:
      matrix: build_piantor.yaml
      archive: piantor-firmware
      keymap: piantor_pro_bt.keymap
      keymap_artifact: piantor-keymap
  release:
    needs: build
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/tags/build')
    uses: ./.github/workflows/_release_keyboard.yml
    with:
      firmware_archive: piantor-firmware
      keymap_artifact: piantor-keymap
      release_tag: latest-piantor
      release_name: Piantor Pro BT Latest Firmware
      release_description: Piantor Pro BT Build
