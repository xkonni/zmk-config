name: "Corne: Build & release"

on:
  workflow_dispatch:
  push:
    branches: [main, v0.3, dev, dev-v0.3]
    tags: ["build"]
    paths:
      - "boards/arm/corne_choc_pro/**"
      - "build_corne.yaml"
      - "config/behaviors.dtsi"
      - "config/key-labels/corne_choc_pro.h"
      - "config/corne_choc_pro.*"
      - "zephyr/**"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build_keyboard.yml
    with:
      matrix: build_corne.yaml
      archive: corne-firmware
      keymap: corne_choc_pro.keymap
      keymap_artifact: corne-keymap
  release:
    needs: build
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/tags/build')
    uses: ./.github/workflows/_release_keyboard.yml
    with:
      firmware_archive: corne-firmware
      keymap_artifact: corne-keymap
      release_tag: latest-corne
      release_name: Corne Choc Pro Latest Firmware
      release_description: Corne Choc Pro Build
