CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBEACON=y

# Let the central (left) fetch the peripheral (right) battery level so the
# keybeacon Battery characteristic can report both halves. ZMK default is n,
# which is why the right battery read fails without it.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Windows battery reporting fix
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Improved BLE connection stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
