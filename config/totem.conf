CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Windows battery reporting fix
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Improved BLE connection stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Reduce battery (BAS) notification traffic
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# Enable mouse/pointing (needed for &mmv and &mkp in totem.keymap)
CONFIG_ZMK_POINTING=y

# Main side fetches peripheral battery
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ... and proxies it to the host over an extra BAS instance
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
